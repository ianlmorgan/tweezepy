name: Test
on: 
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
        exclude:
          - python-version: "3.7"
            os: "ubuntu-latest"
        include:
          - python-version: "3.7"
            os: "ubuntu-22.04"
          - python-version: "3.13"
            os: "macos-latest"
          - python-version: "3.13"
            os: "windows-latest"
        
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -m pip install .
      - name: Run tests
        run: |
          python -m unittest
